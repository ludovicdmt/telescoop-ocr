[project]
name = "telescoop-ocr"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "pyyaml>=6.0.3",
    "transformers>=5.20.2",
]

[project.optional-dependencies]
cpu = ["torch>=2.14.1", "torchvision>=0.29.1"]
cu126 = ["torch>=2.14.1", "torchvision>=0.29.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cu126" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cu126" }]
